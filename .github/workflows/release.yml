# Release runbook: RELEASING.md
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go test ./...
          go vet ./...

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/cnife/flyer:${{ github.ref_name }}
            ghcr.io/cnife/flyer:latest
          build-args: |
            VERSION=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/CNife/flyer
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  npm:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm
        run: npm install -g npm@11.21.1

      - name: Test npm launcher
        working-directory: npm
        run: npm test

      - name: Verify version matches tag
        working-directory: npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p 'require("./package.json").version')"
          if [ "$package_version" != "$version" ]; then
            echo "package.json version $package_version does not match tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Check npm version
        id: npm-version
        working-directory: npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "@cnife/flyer@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack npm launcher
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: npm
        run: npm pack --dry-run

      - name: Publish npm launcher
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: npm
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in
            *-*) tag=next ;;
          esac
          npm stage publish --tag "$tag"
